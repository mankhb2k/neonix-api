# Local Postgres only; run the API with `pnpm dev` and DATABASE_URL=postgres://api:api@localhost:5433/api
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    ports:
      - "5433:5432"
    volumes:
      - api-postgres-data:/var/lib/postgresql/data

volumes:
  api-postgres-data:
